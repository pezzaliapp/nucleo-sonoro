<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nucleo Sonoro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}*{box-sizing:border-box}
/* Layout: schermo HUD a tutta pagina, canvas centrale, barra comandi in basso, letture ai lati */
:root{
  --bg:#03080c; --panel:#071219; --line:#12313d; --fg:#cfeaf2; --dim:#5f8794;
  --hud:#3fe0ff; --hot:#ffffff;
  --f-display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-display);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:10px;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--hud)}
.status{font-family:var(--f-mono);font-size:.72rem;color:var(--dim);letter-spacing:.08em}
.status b{color:var(--fg);font-weight:500}
.stage{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.readout{position:absolute;font-family:var(--f-mono);font-size:.7rem;color:var(--dim);line-height:1.7;letter-spacing:.06em;pointer-events:none;font-variant-numeric:tabular-nums}
.readout span{color:var(--hud)}
.ro-l{left:0;top:4px}.ro-r{right:0;top:4px;text-align:right}
.ro-bl{left:0;bottom:4px}.ro-br{right:0;bottom:4px;text-align:right}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
button,.file{font-family:var(--f-display);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:9px 14px;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
button:hover,.file:hover{border-color:var(--hud);color:var(--hud)}
button:focus-visible,.file:focus-within{outline:2px solid var(--hud);outline-offset:2px}
button.on{background:var(--hud);color:var(--bg);border-color:var(--hud)}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.swatches{display:flex;gap:6px;margin-left:6px}
.sw{width:22px;height:22px;padding:0;clip-path:none;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:var(--hot)}
@media (max-width:560px){.ro-r,.ro-br{display:none}button,.file{padding:8px 10px;font-size:.72rem}}
</style>
</head><body>

<div class="app">
  <header>
    <h1>Nucleo Sonoro</h1>
    <div class="status">SORGENTE <b id="src">IDLE</b> · <b id="trk">nessun brano</b></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="readout ro-l">LIVELLO <span id="lv">-∞</span> dB<br>BASSI <span id="bb">000</span><br>MEDI &nbsp;<span id="bm">000</span><br>ALTI &nbsp;<span id="bh">000</span></div>
    <div class="readout ro-r">PICCO <span id="pk">0</span> Hz<br>FFT 2048 · 44.1k<br>SYNC <span id="sy">STANDBY</span></div>
    <div class="readout ro-bl">T+ <span id="tm">00:00.0</span></div>
    <div class="readout ro-br">CORE <span id="cr">000</span>%</div>
  </div>
  <div class="controls">
    <button id="demo" type="button">▶ Base demo</button>
    <label class="file" for="fileIn">Carica brano<input id="fileIn" type="file" accept="audio/*"></label>
    <button id="pause" type="button" disabled>Pausa</button>
    <button id="fs" type="button">Schermo intero</button>
    <div class="swatches" role="group" aria-label="Colore">
      <button class="sw on" type="button" data-c="#3fe0ff" style="background:#3fe0ff" aria-label="Ciano"></button>
      <button class="sw" type="button" data-c="#ffb43f" style="background:#ffb43f" aria-label="Ambra"></button>
      <button class="sw" type="button" data-c="#5dff9a" style="background:#5dff9a" aria-label="Verde"></button>
      <button class="sw" type="button" data-c="#ff4f6d" style="background:#ff4f6d" aria-label="Rosso"></button>
    </div>
  </div>
</div>
<audio id="au" crossorigin="anonymous"></audio>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),au=$('au');
let hud='#3fe0ff';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Audio ---------- */
let ac,an,master,data,mediaSrc,mode='idle',demoTimer=null,startT=0,paused=false;
function ensureCtx(){
  if(ac) return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  an=ac.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.8;
  master=ac.createGain();master.gain.value=.8;
  master.connect(an);an.connect(ac.destination);
  data=new Uint8Array(an.frequencyBinCount);
}
// Base demo: cassa, hi-hat, basso e accordi sintetizzati a 122 BPM
const BPM=122,STEP=60/BPM/4;
let noiseBuf,step=0,nextT=0;
const bassNotes=[41.2,41.2,0,41.2, 49,0,41.2,0, 55,55,0,49, 43.65,0,46.25,0];
const chords=[[164.8,196,246.9],[130.8,164.8,196],[146.8,174.6,220],[123.5,155.6,185]];
function makeNoise(){const b=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g).connect(master);o.start(t);o.stop(t+.5)}
function hat(t,open){const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=ac.createGain();g.gain.setValueAtTime(open?.18:.1,t);g.gain.exponentialRampToValueAtTime(.001,t+(open?.25:.05));s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+.3)}
function bass(t,f){if(!f)return;const o=ac.createOscillator(),fl=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(900,t);fl.frequency.exponentialRampToValueAtTime(140,t+.2);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+STEP*1.8);o.connect(fl).connect(g).connect(master);o.start(t);o.stop(t+STEP*2)}
function pad(t,ch){ch.forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f*2;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.3);g.gain.linearRampToValueAtTime(0,t+STEP*16);o.connect(g).connect(master);o.start(t);o.stop(t+STEP*16+.05)})}
function schedule(){
  while(nextT<ac.currentTime+.12){
    const s=step%16,bar=Math.floor(step/16);
    if(s%4===0)kick(nextT);
    if(s%2===1)hat(nextT,s===14);
    bass(nextT,bassNotes[s]);
    if(s===0)pad(nextT,chords[bar%4]);
    nextT+=STEP;step++;
  }
}
function stopDemo(){if(demoTimer){clearInterval(demoTimer);demoTimer=null}}
async function startDemo(){
  ensureCtx();await ac.resume();
  au.pause();
  if(!noiseBuf)noiseBuf=makeNoise();
  stopDemo();step=0;nextT=ac.currentTime+.05;schedule();demoTimer=setInterval(schedule,25);
  mode='demo';paused=false;startT=performance.now();
  setUI('DEMO','base sintetica 122 BPM');
}
function playFile(file){
  ensureCtx();ac.resume();stopDemo();
  if(!mediaSrc){mediaSrc=ac.createMediaElementSource(au);mediaSrc.connect(master)}
  if(au.dataset.url)URL.revokeObjectURL(au.dataset.url);
  const url=URL.createObjectURL(file);au.dataset.url=url;au.src=url;
  au.play().then(()=>{mode='file';paused=false;startT=performance.now();setUI('FILE',file.name)}).catch(()=>setUI('ERRORE','formato non supportato'));
}
function setUI(s,t){$('src').textContent=s;$('trk').textContent=t;$('pause').disabled=false;$('pause').textContent='Pausa';$('demo').classList.toggle('on',mode==='demo')}
$('demo').onclick=startDemo;
$('fileIn').onchange=e=>{const f=e.target.files[0];if(f)playFile(f);e.target.value=''};
$('pause').onclick=async()=>{
  if(!ac)return;
  if(!paused){mode==='demo'?await ac.suspend():au.pause();paused=true;$('pause').textContent='Riprendi';$('sy').textContent='PAUSA'}
  else{await ac.resume();if(mode==='file')au.play();paused=false;$('pause').textContent='Pausa'}
};
au.onended=()=>{mode='idle';$('src').textContent='IDLE';$('pause').disabled=true};
$('fs').onclick=()=>{const el=document.documentElement;(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen?.())?.catch?.(()=>{})};
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on');hud=b.dataset.c;document.documentElement.style.setProperty('--hud',hud)});

/* ---------- Disegno ---------- */
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);const r=stage.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
new ResizeObserver(resize).observe(stage);resize();

const N=96,bars=new Float32Array(N),parts=[];
let rot=0,core=0,lastBass=0;
function rgba(a){const h=hud;const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return `rgba(${r},${g},${b},${a})`}
const avg=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=data[i];return s/(b-a)/255};

function frame(now){
  requestAnimationFrame(frame);
  const live=ac&&mode!=='idle'&&!paused;
  let bassV,midV,hiV,level=0,peakHz=0;
  if(live){
    an.getByteFrequencyData(data);
    bassV=avg(1,8);midV=avg(8,90);hiV=avg(90,400);
    let mx=0,mi=0,sum=0;for(let i=1;i<600;i++){sum+=data[i];if(data[i]>mx){mx=data[i];mi=i}}
    level=sum/599/255;peakHz=Math.round(mi*ac.sampleRate/an.fftSize);
    for(let i=0;i<N;i++){const lo=Math.floor(Math.pow(i/N,2)*500)+1,hi=Math.floor(Math.pow((i+1)/N,2)*500)+2;let m=0;for(let k=lo;k<hi;k++)m=Math.max(m,data[k]);bars[i]+= (m/255-bars[i])*.5}
  }else{
    const t=now/1000;bassV=.18+.06*Math.sin(t*1.6);midV=.12;hiV=.06;level=.08;
    for(let i=0;i<N;i++)bars[i]+=((.1+.08*Math.sin(t*1.3+i*.35)+.05*Math.sin(t*2.7-i*.9))-bars[i])*.1;
  }
  core+=(bassV-core)*.35;
  rot+=reduce?0:.0025+midV*.02;

  // particelle sui colpi di cassa
  if(live&&bassV-lastBass>.08&&bassV>.5&&!reduce){for(let i=0;i<24;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;parts.push({a,r:0,s,life:1})}}
  lastBass=bassV;

  ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,R=Math.min(W,H)*.42;

  // griglia di fondo
  ctx.strokeStyle=rgba(.05);ctx.lineWidth=1;
  for(let x=cx%40;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=cy%40;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  ctx.save();ctx.translate(cx,cy);
  ctx.shadowColor=hud;

  // anello esterno a tacche
  ctx.shadowBlur=0;
  for(let i=0;i<120;i++){const a=i/120*Math.PI*2-rot*.3,l=i%10===0?10:4;ctx.strokeStyle=rgba(i%10===0?.7:.3);ctx.beginPath();ctx.moveTo(Math.cos(a)*R,Math.sin(a)*R);ctx.lineTo(Math.cos(a)*(R-l),Math.sin(a)*(R-l));ctx.stroke()}

  // archi segmentati rotanti
  const arc=(r,w,segs,gap,off,al)=>{ctx.lineWidth=w;ctx.strokeStyle=rgba(al);const span=Math.PI*2/segs;for(let i=0;i<segs;i++){ctx.beginPath();ctx.arc(0,0,r,off+i*span,off+(i+1)*span-gap);ctx.stroke()}};
  arc(R*.9,3,3,.5,rot,.55+hiV*.4);
  arc(R*.86,1,24,.08,-rot*1.6,.35);
  arc(R*.42,6,4,.35,-rot*2,.4+bassV*.5);
  arc(R*.36,1.5,60,.05,rot*3,.3);

  // spettro circolare (speculare)
  ctx.shadowBlur=12;ctx.lineCap='round';
  const r0=R*.5,r1=R*.82;
  for(let i=0;i<N;i++){
    const v=bars[i],len=(r1-r0)*Math.min(1,v*1.1);
    for(const side of[1,-1]){
      const a=-Math.PI/2+side*(i+.5)/N*Math.PI;
      ctx.strokeStyle=rgba(.35+v*.65);ctx.lineWidth=Math.max(1.5,R*.012);
      ctx.beginPath();ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);ctx.lineTo(Math.cos(a)*(r0+len+2),Math.sin(a)*(r0+len+2));ctx.stroke();
    }
  }

  // forma d'onda interna (linea che segue i medi)
  ctx.shadowBlur=8;ctx.lineWidth=1.2;ctx.strokeStyle=rgba(.6);ctx.beginPath();
  for(let i=0;i<=N*2;i++){const k=i%N,a=i/(N*2)*Math.PI*2,r=R*.46+bars[k]*R*.04;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}
  ctx.stroke();

  // particelle
  ctx.shadowBlur=6;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.r+=p.s*R*.012;p.life-=.02;if(p.life<=0){parts.splice(i,1);continue}ctx.fillStyle=rgba(p.life);ctx.beginPath();ctx.arc(Math.cos(p.a)*(R*.3+p.r),Math.sin(p.a)*(R*.3+p.r),1.6,0,Math.PI*2);ctx.fill()}

  // nucleo
  const cr=R*(.16+core*.12);
  const g=ctx.createRadialGradient(0,0,0,0,0,cr*2.2);
  g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.25,rgba(.9));g.addColorStop(.6,rgba(.18));g.addColorStop(1,rgba(0));
  ctx.shadowBlur=30;ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,cr*2.2,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle=rgba(.8);ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,cr,0,Math.PI*2);ctx.stroke();
  // raggi del nucleo
  ctx.lineWidth=1;ctx.strokeStyle=rgba(.5);
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2+rot*4;ctx.beginPath();ctx.moveTo(Math.cos(a)*cr*.55,Math.sin(a)*cr*.55);ctx.lineTo(Math.cos(a)*cr*.9,Math.sin(a)*cr*.9);ctx.stroke()}
  ctx.restore();

  // letture
  if(now%6<1||true){
    const db=level>0?(20*Math.log10(level)).toFixed(1):'-∞';
    $('lv').textContent=db;$('bb').textContent=String(Math.round(bassV*999)).padStart(3,'0');
    $('bm').textContent=String(Math.round(midV*999)).padStart(3,'0');$('bh').textContent=String(Math.round(hiV*999)).padStart(3,'0');
    $('pk').textContent=live?peakHz:0;$('cr').textContent=String(Math.round(core*100)).padStart(3,'0');
    if(live)$('sy').textContent='ATTIVO';else if(!paused)$('sy').textContent='STANDBY';
    const el=live?(mode==='file'?au.currentTime:(now-startT)/1000):0;
    $('tm').textContent=`${String(Math.floor(el/60)).padStart(2,'0')}:${(el%60).toFixed(1).padStart(4,'0')}`;
  }
}
requestAnimationFrame(frame);
})();
</script>
</body></html>
